<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uttam Site Planner - Independent Tools</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- ============================================================================
     Home screen. Every card click starts a FRESH instance of that tool - nothing
     is persisted or listed yet, and no tool can see another tool's data.
     ============================================================================ -->
<div id="homeScreen">
  <header class="home-header">
    <h1>Uttam Site Planner <span class="badge">Beta</span></h1>
    <p>
      Pick a tool. Site Plan and Master Plan are two separate, standalone products - each one
      starts from its own plot boundary and keeps its own data, so nothing you enter in one
      ever shows up in the other.
    </p>
  </header>

  <div class="home-cards">
    <button type="button" class="home-card" data-tool="site">
      <span class="home-card-title">Site Plan</span>
      <span class="home-card-desc">
        Enter a plot of any shape as metes and bounds, compute its buildable area, and print a
        surveyor-style sheet.
      </span>
      <span class="home-card-steps">Metes &amp; Bounds &rarr; Print Sheet</span>
    </button>

    <button type="button" class="home-card" data-tool="master">
      <span class="home-card-title">Master Plan</span>
      <span class="home-card-desc">
        Subdivide a plot: carve internal roads, fill the resulting blocks with plots, hand-edit
        any individual plot, and print the finished master plan.
      </span>
      <span class="home-card-steps">Metes &amp; Bounds &rarr; Road Logic &rarr; Plot Logic &rarr; Plot Editor &rarr; Print Sheet</span>
    </button>

    <button type="button" class="home-card disabled" data-tool="floor" aria-disabled="true">
      <span class="home-card-title">Floor Plan</span>
      <span class="home-card-desc">
        Building footprint, floors and rooms, elevation and section. Not built yet.
      </span>
      <span class="home-card-steps">Coming soon</span>
    </button>

    <button type="button" class="home-card disabled" data-tool="more" aria-disabled="true">
      <span class="home-card-title">More</span>
      <span class="home-card-desc">
        Foundation and soak pit, CAD export, cost estimate. Not built yet.
      </span>
      <span class="home-card-steps">Coming soon</span>
    </button>
  </div>

  <p id="homeNote" class="home-note"></p>
</div>

<!-- A mounted tool instance lives here. Only ever one at a time; going Home destroys it. -->
<div id="toolHost"></div>

<!-- ============================================================================
     Shared shell. Both tools clone this same template - the split-screen layout,
     the zoom/pan wrapper, the message area and the step tabs are one piece of UI
     code used twice, each time with its own separate data.
     ============================================================================ -->
<template id="toolShellTemplate">
  <div class="tool-shell">
    <header class="tool-header">
      <div class="tool-header-top">
        <button type="button" class="home-link" data-el="homeBtn">&larr; Home</button>
        <h1 data-el="toolTitle"></h1>
        <span class="badge" data-el="toolBadge"></span>
      </div>
      <nav class="step-tabs" data-el="stepTabs"></nav>
    </header>

    <div class="split">
      <section class="pane-left">
        <div class="zoom-viewport" data-el="zoomViewport">
          <div class="zoom-canvas" data-el="zoomCanvas"></div>
          <div class="zoom-controls" data-el="zoomControls">
            <button type="button" data-el="zoomOutBtn" title="Zoom out">&minus;</button>
            <span class="zoom-level" data-el="zoomLevel">100%</span>
            <button type="button" data-el="zoomInBtn" title="Zoom in">+</button>
            <button type="button" data-el="zoomFitBtn" title="Reset to 100%">Fit</button>
          </div>
          <div class="north-indicator" data-el="northIndicator" style="display:none;">
            <svg viewBox="0 0 80 80" width="80" height="80">
              <line x1="40" y1="74" x2="40" y2="46" stroke="#1f2430" stroke-width="4" />
              <polygon points="26,46 54,46 40,24" fill="#1f2430" />
              <text x="40" y="18" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1f2430">N</text>
            </svg>
          </div>
        </div>

        <div class="legend" data-el="legendHost"></div>
        <div class="message-area" data-el="messageArea"></div>
        <div class="extra-left" data-el="extraLeftHost"></div>
        <div class="action-bar" data-el="actionHost"></div>
      </section>

      <section class="pane-right" data-el="paneRight">
        <div class="readonly-banner" data-el="readonlyBanner" style="display:none;">
          Finalized &mdash; showing saved values
        </div>
        <div data-el="formHost"></div>
      </section>
    </div>

    <!-- Print Sheet stage 2: takes over the whole viewport. -->
    <div class="final-sheet" data-el="finalSheet" style="display:none;">
      <div class="final-sheet-bar">
        <button type="button" class="secondary" data-el="backToEditBtn">&larr; Back to editing</button>
        <span class="final-sheet-title" data-el="finalSheetTitle">Final sheet</span>
        <button type="button" data-el="downloadFinalBtn">Download PDF</button>
      </div>
      <iframe class="final-sheet-frame" data-el="finalSheetFrame" title="Final print sheet"></iframe>
    </div>
  </div>
</template>

<!-- ============================================================================
     Step definitions. Each `.step-def` carries four slots that the shell moves
     (not clones) into the split layout when that step is shown: the diagram, its
     legend, its action buttons, and its right-pane form. Both tools clone this
     whole template and delete the steps they don't have, so the Metes & Bounds
     and Print Sheet markup below is genuinely the same component in both - just
     two separate instances of it.
     ============================================================================ -->
<template id="toolStepsTemplate">

  <!-- ---------------- Metes & Bounds (Site Plan AND Master Plan) ---------------- -->
  <div class="step-def" data-step="mb">
    <div class="step-diagram">
      <svg data-el="sitePreviewSvg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="step-legend">
      <span><span class="swatch" style="border-color:#1f2430;"></span>Plot boundary</span>
      <span><span class="swatch" style="border-color:#999999; border-top-style:dashed;"></span>Buildable area (server-computed)</span>
      <span><span class="swatch" style="border-color:#c0392b; border-top-style:dotted;"></span>Diagonal</span>
      <span><span class="swatch" style="border-color:#8d949e; border-top-width:8px;"></span>Road (width as entered)</span>
    </div>
    <div class="step-actions">
      <button type="button" data-el="computeBtn">Compute area</button>
      <button type="button" data-el="finalizeSiteBtn">Finalize site plot and next</button>
      <span class="hint" data-el="closureNote"></span>
    </div>
    <div class="step-form">
      <h2>Site plot - metes and bounds</h2>
      <p class="hint">
        Walk the perimeter giving each edge's length, then triangulate it with diagonals
        measured from corner A - exactly how a real site is squared up with a tape measure, no
        angle-measuring tool needed. With N sides fixed, a polygon needs exactly
        <strong>N-3</strong> diagonals from A to fully determine its shape.
      </p>

      <div class="row">
        <div class="field">
          <label>Unit</label>
          <select data-el="unitSelect">
            <option value="ft" selected>Feet</option>
            <option value="m">Meter</option>
          </select>
        </div>
        <div class="field">
          <label>Number of sides</label>
          <input type="number" data-el="sidesCount" min="3" max="20" value="4" />
        </div>
      </div>
      <div class="checkbox-row" style="margin-top: 12px;">
        <label><input type="checkbox" data-el="regularToggle" autocomplete="off" /> This is a regular polygon (all sides/angles equal)</label>
      </div>
      <p class="hint" data-el="regularNote" style="display:none;">
        With a regular polygon, every side and diagonal is fixed by the number of sides alone -
        changing one side length changes the polygon's overall size, not its shape.
      </p>

      <table class="edge-table">
        <thead>
          <tr>
            <th style="width: 74px;">Edge</th>
            <th data-el="lengthHeader">Length (ft)</th>
            <th style="width: 130px;">Role</th>
            <th data-el="setbackHeader" style="width: 100px;">Setback (ft)</th>
            <th data-el="roadWidthHeader" style="width: 110px;">Road width (ft)</th>
            <th style="width: 130px;">Neighbour name</th>
            <th style="width: 100px;">Plot no.</th>
          </tr>
        </thead>
        <tbody data-el="edgeRows"></tbody>
      </table>

      <div style="margin-top: 16px;">
        <h3>Diagonals</h3>
        <p class="hint" data-el="diagonalsNote"></p>
        <table class="edge-table" data-el="diagonalsTable" style="display:none;">
          <thead>
            <tr>
              <th style="width: 80px;">From</th>
              <th style="width: 80px;">To</th>
              <th data-el="diagonalLengthHeader">Length (ft)</th>
            </tr>
          </thead>
          <tbody data-el="diagonalRows"></tbody>
        </table>
        <button type="button" class="secondary" data-el="addDiagonalBtn" style="display:none; margin-top: 8px;">+ Add diagonal</button>
      </div>

      <div class="row" style="margin-top: 14px;">
        <div class="field">
          <label data-el="roadExtensionLabel">Road extension (ft, each side)</label>
          <input type="number" data-el="roadExtension" min="0" step="1" value="15" />
        </div>
      </div>

      <div class="result-box" data-el="areaSummary" style="display:none;"></div>
      <div class="status-log empty" data-el="statusLog"></div>
      <div class="error-box" data-el="errorBox" style="display:none;"></div>
      <div class="result-box" data-el="resultBox" style="display:none;"></div>
    </div>
  </div>

  <!-- ---------------- Road Logic (Master Plan only) ---------------- -->
  <div class="step-def" data-step="road">
    <div class="step-diagram">
      <svg data-el="roadLogicSvg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="step-legend">
      <span><span class="swatch" style="border-color:#1f2430;"></span>Plot boundary</span>
      <span><span class="swatch" style="border-color:#7d5ba6; border-top-width:6px;"></span>Road</span>
    </div>
    <div class="step-actions">
      <button type="button" class="secondary" data-el="addRoadBtn">+ Add road</button>
      <button type="button" data-el="finalizeRoadLogicBtn">Finalize road logic</button>
      <span class="hint" data-el="finalizeRoadLogicNote"></span>
    </div>
    <div class="step-form">
      <h2>Road logic</h2>
      <p class="hint">
        Lay out the internal road network you'll carve this plot into smaller lots along - each
        road connects to an existing plot side, an already-placed road, or ends as a dead end.
        The diagram updates when you finalize or add/change a road, not on every keystroke.
      </p>
      <p class="hint" data-el="roadLogicNote">No roads yet - click "Add road" to start.</p>
      <div data-el="roadRows"></div>
    </div>
  </div>

  <!-- ---------------- Plot Logic (Master Plan only) ---------------- -->
  <div class="step-def" data-step="plots">
    <div class="step-diagram">
      <svg data-el="plotLogicSvg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="step-legend">
      <span><span class="swatch" style="border-color:#1f2430;"></span>Plot boundary</span>
      <span><span class="swatch" style="border-color:#7d5ba6; border-top-width:6px;"></span>Road</span>
      <span><span class="swatch" style="border-color:#2f6f4f;"></span>Sub-section</span>
      <span><span class="swatch" style="border-color:#c87828; border-top-style:dotted;"></span>Fill plot (no road frontage)</span>
      <span><span class="swatch" style="border-color:#9aa1ac; border-top-style:dashed;"></span>Open space (not a plot)</span>
    </div>
    <div class="step-actions">
      <button type="button" data-el="finalizePlotLogicBtn">Finalize plot logic</button>
      <span class="hint" data-el="finalizePlotLogicNote"></span>
    </div>
    <div class="step-form">
      <h2>Plot logic</h2>
      <p class="hint">
        The finalized roads divide the plot into sub-sections - set target plot size and spacing
        per sub-section, then insert plots into each one. The diagram updates when you click a
        sub-section's "Insert plots", not as you type.
      </p>
      <p class="hint" data-el="plotLogicNote"></p>
      <div data-el="subsectionRows"></div>
      <div data-el="plotLogicCard" style="display:none;"></div>
    </div>
  </div>

  <!-- ---------------- Plot Editor (Master Plan only) ---------------- -->
  <div class="step-def" data-step="editor">
    <div class="step-diagram">
      <svg data-el="plotEditorSvg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet" class="clickable-plots"></svg>
    </div>
    <div class="step-legend">
      <span><span class="swatch" style="border-color:#1f2430;"></span>Plot boundary</span>
      <span><span class="swatch" style="border-color:#7d5ba6; border-top-width:6px;"></span>Road</span>
      <span><span class="swatch" style="border-color:#2f6f4f;"></span>Sub-section / real plot</span>
      <span><span class="swatch" style="border-color:#c87828; border-top-style:dotted;"></span>Fill plot (not editable)</span>
      <span><span class="swatch" style="border-color:#9aa1ac; border-top-style:dashed;"></span>Open space (not a plot)</span>
      <span><span class="swatch" style="border-color:#1f6fb4; border-top-width:3px;"></span>Plot being edited</span>
    </div>
    <div class="step-actions">
      <button type="button" data-el="finalizeMasterPlanBtn">Finalize master plan</button>
      <span class="hint" data-el="finalizeMasterPlanNote"></span>
    </div>
    <div class="step-form">
      <h2>Plot editor</h2>
      <p class="hint">
        <strong>Click a real plot on the drawing</strong> to load it for editing (or type its name
        below - both work). Use <strong>&minus;</strong> / <strong>+</strong> to shrink or grow it
        by pushing one of its own edges, or edit a side/diagonal directly. A plot only ever grows
        into <em>free land</em> and only ever gives land back to it - <strong>no other plot is ever
        moved</strong>. Nothing is permanent until you click "Save plot"; switching to a different
        plot discards an in-progress edit.
      </p>

      <div class="row">
        <div class="field">
          <label>Add plot (promote fill plot(s) to real, e.g. S1F1 S1F2)</label>
          <input type="text" data-el="addPlotInput" placeholder="e.g. S1F1 S1F2" />
        </div>
        <button type="button" class="secondary" data-el="addPlotBtn">Add plot</button>
      </div>
      <p class="hint" data-el="addPlotNote"></p>

      <div class="row" style="margin-top: 12px;">
        <div class="field">
          <label>Plot name</label>
          <input type="text" data-el="plotNameInput" placeholder="e.g. S1P1" />
        </div>
        <button type="button" class="secondary" data-el="resetPlotBtn">Reset plot</button>
        <button type="button" data-el="savePlotBtn">Save plot</button>
      </div>
      <p class="hint" data-el="plotNameNote"></p>
      <p class="hint" data-el="savePlotNote"></p>

      <div data-el="plotEditFields" style="display:none; margin-top: 14px;">
        <div class="row">
          <div class="field">
            <label>Number of sides (fixed)</label>
            <input type="number" data-el="plotSidesCount" disabled />
          </div>
          <div class="field">
            <label>Plot area</label>
            <div class="row" style="gap: 8px; align-items: center; margin-top: 2px;">
              <button type="button" class="secondary stepper-btn" data-el="plotAreaMinusBtn">&minus;</button>
              <span data-el="plotAreaValue" style="min-width: 100px; text-align: center; font-weight: 600;"></span>
              <button type="button" class="secondary stepper-btn" data-el="plotAreaPlusBtn">+</button>
            </div>
          </div>
          <div class="field">
            <label>Push edge</label>
            <select data-el="pushEdgeSelect"></select>
          </div>
        </div>
        <p class="hint" data-el="plotAreaStepNote"></p>

        <table class="edge-table" style="margin-top: 10px;">
          <thead>
            <tr><th style="width: 80px;">Edge</th><th>Length (ft)</th></tr>
          </thead>
          <tbody data-el="plotEdgeRows"></tbody>
        </table>

        <div style="margin-top: 16px;">
          <h3>Diagonals</h3>
          <p class="hint" data-el="plotDiagonalsNote"></p>
          <table class="edge-table" data-el="plotDiagonalsTable" style="display:none;">
            <thead>
              <tr><th style="width: 80px;">From</th><th style="width: 80px;">To</th><th>Length (ft)</th></tr>
            </thead>
            <tbody data-el="plotDiagonalRows"></tbody>
          </table>
          <button type="button" class="secondary" data-el="addPlotDiagonalBtn" style="display:none; margin-top: 8px;">+ Add diagonal</button>
        </div>

        <p class="hint" data-el="plotAreaNote" style="margin-top: 12px; font-weight: 600;"></p>
      </div>

      <div data-el="plotEditorCard" style="display:none;"></div>

      <div class="locked-plan" data-el="masterPlanCard" style="display:none;">
        <h3>Final master plan (locked)</h3>
        <div class="mini-preview">
          <svg data-el="masterPlanSvg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="result-box" data-el="masterPlanSummary" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ---------------- North Setter (Site Plan AND Master Plan) ----------------
       Orienting the drawing to true north is its own step, ahead of composing the sheet: the
       rotation is a property of the drawing, not of the sheet's text block, and it is the last
       thing that changes the geometry the sheet embeds. -->
  <div class="step-def" data-step="north">
    <div class="step-diagram">
      <svg data-el="finalSitePlanSvg" viewBox="-250 -250 1100 920" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="step-legend">
      <span>Ink-only presentation drawing. North stays fixed - rotate the drawing until its true north lines up with the arrow.</span>
    </div>
    <div class="step-actions">
      <button type="button" class="secondary" data-el="finaliseBtn">Redraw drawing</button>
      <button type="button" data-el="finalizeNorthBtn">Finalise north</button>
      <span class="hint" data-el="finalizeNorthNote"></span>
    </div>
    <div class="step-form">
      <h2>North setter</h2>
      <p class="hint">
        The north arrow on the drawing is <strong>fixed</strong> and never moves - exactly like
        the printed arrow on a real site plan sheet. Rotate the drawing itself until its true
        north lines up with that arrow. The drawing updates as you type. "Finalise north" locks
        the orientation in and moves on to the print sheet, which embeds the drawing at this
        angle.
      </p>

      <div class="row">
        <div class="field">
          <label>Rotate drawing (degrees)</label>
          <input type="number" data-el="rotationInput" min="0" max="359" step="1" value="0" />
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------- Print Sheet (Site Plan AND Master Plan) ---------------- -->
  <div class="step-def" data-step="print">
    <div class="step-diagram">
      <iframe data-el="pdfPreviewFrame" title="Print sheet preview" class="sheet-preview-frame"></iframe>
    </div>
    <div class="step-legend">
      <span>Live preview of this tool's own sheet, at the north angle finalised in the previous step.</span>
    </div>
    <div class="step-actions">
      <button type="button" class="secondary" data-el="previewPdfBtn">Refresh sheet preview</button>
      <button type="button" data-el="continueSheetBtn">Continue to final sheet</button>
      <span class="hint" data-el="pdfNote"></span>
    </div>
    <div class="step-form">
      <h2>Print sheet</h2>
      <p class="hint">
        Stage 1 of 2. Only the text below is editable - the drawing, its orientation, its
        geometry and every computed area come from this tool's own finalized data and are
        read-only here. The preview on the left refreshes as you type. "Continue to final sheet"
        locks these values into a full-screen final preview you can download from.
      </p>

      <div class="row">
        <div class="field">
          <label>Under</label>
          <select data-el="adminTypeSelect">
            <option value="Municipality" selected>Municipality</option>
            <option value="Municipal Corporation">Municipal Corporation</option>
            <option value="Panchayet">Panchayet</option>
          </select>
        </div>
        <div class="field">
          <label data-el="adminNameLabel">Municipality name</label>
          <input type="text" data-el="adminNameInput" placeholder="e.g. Purulia" />
        </div>
        <div class="field">
          <label>Ward No.</label>
          <input type="text" data-el="wardNoInput" placeholder="e.g. 1" />
        </div>
      </div>

      <div class="row" style="margin-top: 14px;">
        <div class="field">
          <label>R.S Khatian No.</label>
          <input type="text" data-el="rsKhatianInput" placeholder="e.g. 191" />
        </div>
        <div class="field">
          <label>R.S Plot No.</label>
          <input type="text" data-el="rsPlotInput" placeholder="e.g. 4718/P" />
        </div>
        <div class="field">
          <label>C.S Plot No.</label>
          <input type="text" data-el="csPlotInput" placeholder="e.g. 968/P" />
        </div>
      </div>

      <div class="row" style="margin-top: 14px;">
        <div class="field">
          <label>Sketch map</label>
          <div class="checkbox-row">
            <label><input type="radio" name="sketchScaleMode" value="nts" data-el="sketchScaleNTS" /> Not to scale</label>
            <label><input type="radio" name="sketchScaleMode" value="scale" data-el="sketchScaleToScale" checked /> To scale</label>
          </div>
          <div class="ratio-row" data-el="sketchScaleRatioRow" style="display: flex;">
            <input type="number" data-el="sketchScaleX" placeholder="x" min="0" step="any" value="16" />
            <span>:</span>
            <input type="number" data-el="sketchScaleY" placeholder="y" min="0" step="any" value="1" />
          </div>
        </div>
        <div class="field">
          <label>Site plan</label>
          <div class="checkbox-row">
            <label><input type="radio" name="siteScaleMode" value="nts" data-el="siteScaleNTS" /> Not to scale</label>
            <label><input type="radio" name="siteScaleMode" value="scale" data-el="siteScaleToScale" checked /> To scale</label>
          </div>
          <div class="ratio-row" data-el="siteScaleRatioRow" style="display: flex;">
            <input type="number" data-el="siteScaleX" placeholder="x" min="0" step="any" value="16" />
            <span>:</span>
            <input type="number" data-el="siteScaleY" placeholder="y" min="0" step="any" value="1" />
          </div>
        </div>
        <div class="field">
          <label>Mouza map</label>
          <div class="checkbox-row">
            <label><input type="radio" name="mouzaScaleMode" value="nts" data-el="mouzaScaleNTS" /> Not to scale</label>
            <label><input type="radio" name="mouzaScaleMode" value="scale" data-el="mouzaScaleToScale" checked /> To scale</label>
          </div>
          <div class="ratio-row" data-el="mouzaScaleRatioRow" style="display: flex;">
            <input type="number" data-el="mouzaScaleX" placeholder="x" min="0" step="any" value="16" />
            <span>:</span>
            <input type="number" data-el="mouzaScaleY" placeholder="y" min="0" step="any" value="1" />
          </div>
        </div>
      </div>

      <div class="row" style="margin-top: 14px;">
        <div class="field">
          <label>Surveyor name</label>
          <input type="text" data-el="surveyorNameInput" placeholder="e.g. Bidyut Kumar Mahato" />
        </div>
        <div class="field">
          <label>Surveyor Regd. No.</label>
          <input type="text" data-el="surveyorRegdInput" placeholder="e.g. 02711" />
        </div>
        <div class="field" style="flex: 1; min-width: 200px;">
          <label>Drawn by (address)</label>
          <input type="text" data-el="drawnByInput" placeholder="e.g. Kurmashol, Kuda, Kenda, Purulia" />
        </div>
      </div>

      <div class="row" style="margin-top: 14px;">
        <div class="field" style="flex: 1; min-width: 280px;">
          <label>Additional notes (signatures, P.S./District, reference area, etc.)</label>
          <textarea data-el="additionalNotesInput" rows="4" placeholder="P.S- ..., DIST- ...,&#10;REF. AREA- ... SQ.FT./... KATHA. ... CHH SHOWN IN"></textarea>
        </div>
        <div class="field">
          <label>Mouza map image</label>
          <input type="file" data-el="mouzaMapInput" accept="image/*" />
        </div>
      </div>

      <!-- Not shown in stage 1; the stage-2 overlay's own Download button drives this. -->
      <button type="button" data-el="downloadPdfBtn" style="display:none;" disabled>Download PDF</button>
    </div>
  </div>

</template>
